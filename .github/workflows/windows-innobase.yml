# Windows compile check for the InnoDB directory-flush change.
#
# Upstream CI (mysql/mysql-server) has no Windows job at all, so the
# `#else /* _WIN32 */` half of os0file.cc is never compiled by PR CI.
# This workflow configures MySQL on windows-latest and builds only the
# `innobase` plugin target, which is the translation unit set that contains
# os0file.cc. It exists to prove the Windows branch compiles; it is not a
# substitute for upstream's own Windows packaging build.
#
# Lives on the contributor fork only; it is NOT part of the upstream PR.

name: Windows compile check (InnoDB)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to compile (contains the InnoDB patch)'
        required: false
        default: 'ci/windows-innobase'
        type: string

permissions:
  contents: read

jobs:
  innobase-msvc:
    name: Build innobase (MSVC x64)
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'ci/windows-innobase' }}
          persist-credentials: false

      - name: Show toolchain and Visual Studio installations
        shell: pwsh
        run: |
          cmake --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            Write-Host '--- vswhere ---'
            & $vswhere -products * -prerelease -property installationPath
            & $vswhere -products * -prerelease -property installationVersion
          } else {
            Write-Host 'vswhere not found'
          }
          Write-Host '--- CMake Visual Studio generators ---'
          (cmake --help) -split "`n" |
            Where-Object { $_ -match 'Visual Studio \d+ \d{4}' } |
            ForEach-Object { $_.Trim() }

      - name: Pick the newest Visual Studio generator
        shell: pwsh
        run: |
          $gens = (cmake --help) -split "`n" | ForEach-Object {
            if ($_ -match '(Visual Studio (\d+) \d{4})') {
              [pscustomobject]@{ Name = $Matches[1]; Ver = [int]$Matches[2] }
            }
          } | Sort-Object Ver -Unique
          if (-not $gens) {
            Write-Error 'No Visual Studio generator available in this CMake'
            exit 1
          }
          $gen = ($gens | Select-Object -Last 1).Name
          Write-Host "Picked generator: $gen"
          "VS_GEN=$gen" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Boost is vendored in extra/boost, ICU/protobuf/zlib/lz4 are vendored
      # under extra/, so OpenSSL is the only external dependency.
      - name: Locate OpenSSL
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files\OpenSSL-Win64',
            'C:\Program Files\OpenSSL',
            'C:\OpenSSL'
          )
          $found = $null
          foreach ($c in $candidates) {
            if (Test-Path $c) {
              Write-Host "candidate: $c"
              Get-ChildItem $c -Directory | Select-Object Name
              if (Test-Path (Join-Path $c 'include\openssl\ssl.h')) {
                Write-Host "  -> has include\openssl\ssl.h"
                $found = $c
                break
              }
            }
          }
          if (-not $found) {
            Write-Error 'No usable OpenSSL installation found'
            exit 1
          }
          Write-Host "OPENSSL_DIR=$found"
          "OPENSSL_DIR=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure (MySQL, Windows)
        shell: pwsh
        run: |
          Write-Host "Generator=$env:VS_GEN  SSL=$env:OPENSSL_DIR"
          cmake -S . -B build -G "$env:VS_GEN" -A x64 `
            -DWITH_SSL="$env:OPENSSL_DIR" `
            -DWITH_UNIT_TESTS=OFF `
            -DWITH_ROUTER=OFF `
            -DWITH_NDB=OFF `
            -DWITH_NDBCLUSTER=OFF `
            -DWITH_MECAB=OFF `
            -DWITH_EDITLINE=bundled `
            -DWITH_ICU=bundled `
            -DWITH_PROTOBUF=bundled `
            -DMYSQL_MAINTAINER_MODE=OFF
          if ($LASTEXITCODE -ne 0) {
            Write-Host '--- CMakeError.log ---'
            Get-ChildItem build -Recurse -Filter 'CMakeError.log' -ErrorAction SilentlyContinue |
              ForEach-Object { Get-Content $_.FullName -Tail 120 }
            exit 1
          }

      - name: Build innobase target
        shell: pwsh
        run: |
          cmake --build build --config Debug --target innobase --parallel 4 2>&1 |
            Tee-Object -FilePath build-innobase.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build-innobase.log -Tail 200
            exit 1
          }

      - name: Confirm os0file.cc was compiled (not skipped)
        shell: pwsh
        run: |
          $obj = Get-ChildItem -Path build -Recurse -Filter 'os0file*.obj' -ErrorAction SilentlyContinue
          if (-not $obj) {
            Write-Error 'os0file.cc did not produce an object file - the Windows branch was NOT compiled'
            exit 1
          }
          $obj | Select-Object FullName, Length, LastWriteTime

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: innobase-windows-build-log
          path: |
            build-innobase.log
            build/CMakeCache.txt
          if-no-files-found: warn
