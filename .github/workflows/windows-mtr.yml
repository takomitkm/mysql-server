# Windows MTR regression check for the InnoDB directory-flush change.
#
# The companion workflow (windows-innobase.yml) proves the _WIN32 half of
# os0file.cc compiles. This one goes further: builds the full server (mysqld)
# with MSVC and runs a focused MTR subset covering the code paths the patch
# touches -- file creation (os_file_create_func), directory creation,
# deletion (os_file_delete_if_exists_func) and rename.
#
# HONEST SCOPE: MTR runs a live mysqld; it cannot simulate a power loss, so it
# cannot prove directory entries reach stable storage. It proves the patch did
# not break normal Windows create/drop/rename behaviour. It is not a durability
# test and not a substitute for Oracle's own Windows packaging/CI.
#
# Lives on the contributor fork only; it is NOT part of the upstream PR.

name: Windows MTR (InnoDB file ops)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to test (contains the InnoDB patch)'
        required: false
        default: 'ci/windows-innobase'
        type: string
      do_test:
        description: 'MTR --do-test regex (file-operation tests)'
        required: false
        default: '^(create_tablespace|create_table|rename_table|alter_rename_files)$'
        type: string

permissions:
  contents: read

jobs:
  mtr-innodb-win:
    name: MTR innodb file ops (MSVC x64, Debug)
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'ci/windows-innobase' }}
          persist-credentials: false

      - name: Show toolchain
        shell: pwsh
        run: cmake --version

      - name: Pick the newest Visual Studio generator
        shell: pwsh
        run: |
          $gens = (cmake --help) -split "`n" | ForEach-Object {
            if ($_ -match '(Visual Studio (\d+) \d{4})') {
              [pscustomobject]@{ Name = $Matches[1]; Ver = [int]$Matches[2] }
            }
          } | Sort-Object Ver -Unique
          if (-not $gens) { Write-Error 'No Visual Studio generator'; exit 1 }
          $gen = ($gens | Select-Object -Last 1).Name
          Write-Host "Picked generator: $gen"
          "VS_GEN=$gen" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install bison (required by router/src/routing_guidelines)
        shell: pwsh
        run: |
          choco install winflexbison3 --no-progress -y
          $found = (Get-Command win_bison -ErrorAction SilentlyContinue).Source
          if (-not $found) {
            $candidate = 'C:\ProgramData\chocolatey\bin\win_bison.exe'
            if (Test-Path $candidate) { $found = $candidate }
          }
          if (-not $found) { Write-Error 'win_bison not found'; exit 1 }
          "BISON_EXECUTABLE=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Locate OpenSSL
        shell: pwsh
        run: |
          $found = $null
          foreach ($c in @('C:\Program Files\OpenSSL-Win64',
                           'C:\Program Files\OpenSSL', 'C:\OpenSSL')) {
            if (Test-Path $c) {
              if (Test-Path (Join-Path $c 'include\openssl\ssl.h')) {
                $found = $c; break
              }
            }
          }
          if (-not $found) { Write-Error 'No usable OpenSSL'; exit 1 }
          Write-Host "OPENSSL_DIR=$found"
          "OPENSSL_DIR=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure (Debug, with unit tests for MTR debug-sync tests)
        shell: pwsh
        run: |
          Write-Host "Generator=$env:VS_GEN  SSL=$env:OPENSSL_DIR"
          cmake -S . -B build -G "$env:VS_GEN" -A x64 `
            -DCMAKE_BUILD_TYPE=Debug `
            -DWITH_SSL="$env:OPENSSL_DIR" `
            -DBISON_EXECUTABLE="$env:BISON_EXECUTABLE" `
            -DWITH_UNIT_TESTS=ON `
            -DWITH_ROUTER=OFF `
            -DWITH_NDB=OFF `
            -DWITH_NDBCLUSTER=OFF `
            -DWITH_MECAB=OFF `
            -DWITH_EDITLINE=bundled `
            -DWITH_ICU=bundled `
            -DWITH_PROTOBUF=bundled `
            -DMYSQL_MAINTAINER_MODE=OFF
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build full server (mysqld + client + mysql-test targets)
        shell: pwsh
        run: |
          cmake --build build --config Debug --parallel 4 2>&1 |
            Tee-Object -FilePath build-server.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build-server.log -Tail 200
            exit 1
          }

      - name: Confirm mysqld binary exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter 'mysqld.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $exe) {
            Write-Error 'mysqld.exe not found - cannot run MTR'
            exit 1
          }
          Write-Host "mysqld: $($exe.FullName) ($($exe.Length) bytes)"

      - name: Locate Perl and MTR launcher
        shell: pwsh
        run: |
          $perl = (Get-Command perl -ErrorAction SilentlyContinue).Source
          if (-not $perl) { Write-Error 'perl not found'; exit 1 }
          Write-Host "perl: $perl"
          $mtr = Get-ChildItem -Path build -Recurse -Filter 'mtr' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'mysql-test' } | Select-Object -First 1
          if ($mtr) { Write-Host "mtr launcher: $($mtr.FullName)" }
          else { Write-Host 'mtr launcher not pre-generated; will use mysql-test-run.pl directly' }

      - name: Runtime smoke (initialize + start + DDL + shutdown)
        shell: pwsh
        run: |
          # Self-diagnosing runtime proof that does not depend on MTR's Windows
          # harness: run the freshly built mysqld directly and exercise exactly
          # the four call sites this patch adds flush calls to.
          #   init        -> os_file_create_func (ibdata1, #innodb_redo, undo, dd)
          #   CREATE TABLE-> os_file_create_func (.ibd)
          #   RENAME TABLE-> os_file_rename_func (MOVEFILE_WRITE_THROUGH)
          #   DROP TABLE  -> os_file_delete_if_exists_func
          # Output is captured in full so a failure is readable in the log.
          $bindir = (Resolve-Path build).Path
          $bin    = Join-Path $bindir 'runtime_output_directory\Debug'
          $mysqld = Join-Path $bin 'mysqld.exe'
          $mysql  = Join-Path $bin 'mysql.exe'
          foreach ($p in @($mysqld, $mysql)) {
            if (-not (Test-Path $p)) { Write-Error "missing $p"; exit 1 }
          }
          $smoke = Join-Path $bindir 'smoke'
          Remove-Item -Recurse -Force $smoke -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$smoke\data" | Out-Null
          "bindir=$bindir" | Out-File "$smoke\smoke.log" -Encoding utf8

          Write-Host '--- mysqld --initialize-insecure ---'
          & $mysqld --no-defaults --initialize-insecure `
              "--basedir=$bindir" "--datadir=$smoke\data" --console 2>&1 |
            Tee-Object -FilePath "$smoke\init.log" -Append
          $rc = $LASTEXITCODE
          Write-Host "init exit=$rc"
          if ($rc -ne 0) {
            Get-Content "$smoke\init.log" -Tail 120
            exit 1
          }

          Write-Host '--- start mysqld ---'
          $port = 13306
          $proc = Start-Process -FilePath $mysqld -PassThru -NoNewWindow `
            -ArgumentList @('--no-defaults', "--basedir=$bindir",
                            "--datadir=$smoke\data", "--port=$port",
                            '--bind-address=127.0.0.1', '--console',
                            '--log-error-verbosity=3') `
            -RedirectStandardOutput "$smoke\server.out" `
            -RedirectStandardError  "$smoke\server.err"
          Write-Host "mysqld pid=$($proc.Id)"

          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            if ($proc.HasExited) {
              Write-Host "mysqld exited early, code=$($proc.ExitCode)"
              break
            }
            & $mysql --protocol=tcp -h 127.0.0.1 -P $port -u root `
                     -e 'SELECT 1' *> $null
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
          }

          if ($ready) {
            Write-Host '--- DDL exercising the patched call sites ---'
            $ddl = @(
              'CREATE DATABASE smoke_d',
              'CREATE TABLE smoke_d.t1 (a INT PRIMARY KEY) ENGINE=InnoDB',
              'INSERT INTO smoke_d.t1 VALUES (1),(2),(3)',
              'CREATE TABLE smoke_d.t2 (a INT PRIMARY KEY) ENGINE=InnoDB',
              'RENAME TABLE smoke_d.t2 TO smoke_d.t3',
              'DROP TABLE smoke_d.t3',
              'CREATE TABLESPACE smoke_ts ADD DATAFILE ''smoke_ts.ibd'' ENGINE=InnoDB',
              'DROP TABLESPACE smoke_ts',
              'DROP TABLE smoke_d.t1',
              'DROP DATABASE smoke_d'
            ) -join '; '
            & $mysql --protocol=tcp -h 127.0.0.1 -P $port -u root -e $ddl 2>&1 |
              Tee-Object -FilePath "$smoke\ddl.log" -Append
            Write-Host "ddl exit=$LASTEXITCODE"
            if ($LASTEXITCODE -ne 0) { Get-Content "$smoke\ddl.log" -Tail 80 }
          }

          $ok = $ready
          Write-Host '--- shutdown ---'
          if ($ready) {
            & $mysql --protocol=tcp -h 127.0.0.1 -P $port -u root -e 'SHUTDOWN' *> $null
            $proc.WaitForExit(60000) | Out-Null
          } else {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

          Write-Host '--- server stderr tail ---'
          if (Test-Path "$smoke\server.err") {
            Get-Content "$smoke\server.err" -Tail 100
          }
          if (Test-Path "$smoke\server.out") {
            Get-Content "$smoke\server.out" -Tail 40
          }

          # A crash or an InnoDB assertion in the patched helper would show up
          # as a non-zero exit or a "Assertion" / our warning message here.
          $errtxt = ''
          foreach ($f in @("$smoke\server.err", "$smoke\server.out")) {
            if (Test-Path $f) { $errtxt += Get-Content $f -Raw }
          }
          if ($errtxt -match 'fatal error|InnoDB: Assertion|semaphore') {
            Write-Host 'FATAL marker found in server output'
            exit 1
          }
          if ($errtxt -match 'PARENT_DIR_FLUSH_SKIPPED|Cannot open volume root directory') {
            Write-Host 'directory-flush warning was emitted (volume root ACL case)'
          }
          if (-not $ok) { Write-Error 'runtime smoke failed to reach a running server'; exit 1 }
          Write-Host 'RUNTIME SMOKE OK'

      - name: Run MTR (InnoDB file-operation subset)
        shell: pwsh
        run: |
          # Out-of-source build: MTR_BINDIR must point at the build tree, else
          # MTR looks for runtime_output_directory/ under the source dir and
          # bails with "Could not find any of ... runtime_output_directory".
          # Multi-config VS generator puts the binaries under <build>/
          # runtime_output_directory/<Config>/, so --vs-config pins it.
          $env:MTR_BINDIR = (Resolve-Path build).Path
          $env:DO_TEST = '${{ inputs.do_test || '' }}'
          Write-Host "MTR_BINDIR=$env:MTR_BINDIR"
          Write-Host "DO_TEST=$env:DO_TEST"
          Push-Location mysql-test
          perl mysql-test-run.pl `
            --vs-config=Debug `
            --parallel=1 --force --retry=1 `
            --max-test-fail=10 --suite=innodb `
            --do-test="$env:DO_TEST" 2>&1 | Tee-Object -FilePath ../mtr-run.log
          $rc = $LASTEXITCODE
          Pop-Location
          if ($rc -ne 0) {
            Write-Host '--- MTR tail ---'
            Get-Content mtr-run.log -Tail 250
            Write-Host '--- mysqld error logs ---'
            Get-ChildItem build\mysql-test\var -Recurse -Filter '*.err' -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "== $($_.FullName)"
                Get-Content $_.FullName -Tail 60
              }
            exit 1
          }

      - name: Upload MTR + build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-mtr-innodb-logs
          path: |
            mtr-run.log
            build-server.log
            build/smoke/*.log
            build/smoke/server.err
            build/smoke/server.out
            build/mysql-test/var/**
          if-no-files-found: warn
